<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collectors Project</title>
</head>
<body>
    <h1 style="background-color: red; color: white; text-align: center;">Pokemon Collector</h1>
    <hr>
    <h2 style="text-align: center; color: blueviolet;">Login Form</h2>
    <form action="main.html" style="text-align: center; ">
        <label for="username">Enter Username:</label>
        <input type="text" name="username" id="username" placeholder="Enter Username" required><br>
        <label for="pass">Enter Password</label>
        <input type="password" name="pass" id="pass" placeholder="Enter Password" required minlength="1" maxlength="16"><br>

        <button type="submit">Submit Here</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
